<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101321">
  <title>Orbit — Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #101321;
      --surface: #191d30;
      --surface-raised: #20253a;
      --text: #f5f5fb;
      --muted: #a2a8be;
      --line: #343a53;
      --accent: #a892ff;
      --accent-strong: #8065f5;
      --frame: #4a506d;
      --grid: rgb(168 146 255 / 4%);
      --correct: #48d6a0;
      --incorrect: #ff7189;
      --shadow: 0 28px 90px rgb(0 0 0 / 30%);
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --page: #f3f2fc;
        --surface: #fff;
        --surface-raised: #f7f6fe;
        --text: #25243b;
        --muted: #77778f;
        --line: #e5e2f1;
        --accent: #7158df;
        --accent-strong: #6248d4;
        --frame: #d8d3e9;
        --grid: rgb(91 73 163 / 3%);
        --correct: #12895f;
        --incorrect: #d84462;
        --shadow: 0 28px 90px rgb(61 49 115 / 13%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 14% 10%, rgb(117 87 219 / 15%), transparent 33%),
        radial-gradient(ellipse at 88% 84%, rgb(52 171 178 / 10%), transparent 31%),
        var(--page);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app { width: min(100%, 560px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid rgb(168 146 255 / 40%);
      border-radius: 9px;
      color: var(--accent);
      background: rgb(168 146 255 / 10%);
      font-size: 16px;
      letter-spacing: 0;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--frame);
      border-radius: 18px;
      background:
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(var(--grid) 1px, transparent 1px),
        var(--surface);
      background-size: 24px 24px;
      box-shadow: var(--shadow), 0 0 0 4px color-mix(in srgb, var(--accent) 7%, transparent);
    }

    .card::before {
      position: absolute;
      z-index: 1;
      inset: 7px;
      border: 1px solid color-mix(in srgb, var(--frame) 58%, transparent);
      border-radius: 12px;
      content: "";
      pointer-events: none;
    }

    .card-content, .result { position: relative; z-index: 2; }
    .card-content { padding: clamp(24px, 6vw, 38px); }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .mission-heading { display: grid; gap: 3px; }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .mission-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .status-light {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--correct);
      box-shadow: 0 0 9px color-mix(in srgb, var(--correct) 62%, transparent);
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid var(--frame);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface-raised) 86%, transparent);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .score-pill span { color: #ffc764; }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border: 1px solid var(--frame);
      border-radius: 3px;
      background: var(--surface-raised);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #a892ff, #72d9d0);
      transition: width 400ms cubic-bezier(.2, .8, .2, 1);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    .question {
      margin: 29px 0 23px;
      padding-left: 15px;
      border-left: 2px solid var(--accent);
      font-size: clamp(21px, 5vw, 26px);
      font-weight: 720;
      letter-spacing: -.035em;
      line-height: 1.3;
    }

    .answers { display: grid; gap: 11px; }

    .answer {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 13px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      background: color-mix(in srgb, var(--surface-raised) 91%, transparent);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface-raised));
    }

    .answer:focus-visible, .next-button:focus-visible, .restart-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 65%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      display: grid;
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: color-mix(in srgb, var(--correct) 65%, transparent);
      background: color-mix(in srgb, var(--correct) 14%, var(--surface));
      animation: pop-in 340ms ease both;
    }

    .answer.correct .answer-letter {
      border-color: transparent;
      color: var(--page);
      background: var(--correct);
    }

    .answer.wrong {
      border-color: color-mix(in srgb, var(--incorrect) 68%, transparent);
      background: color-mix(in srgb, var(--incorrect) 12%, var(--surface));
      animation: shake 380ms ease both;
    }

    .answer.wrong .answer-letter {
      border-color: transparent;
      color: var(--page);
      background: var(--incorrect);
    }

    .feedback {
      min-height: 48px;
      margin-top: 17px;
      color: var(--muted);
      font-size: 14px;
    }

    .feedback strong { color: var(--text); }

    .next-button, .restart-button {
      display: flex;
      width: 100%;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(110deg, var(--accent-strong), #8f72f3);
      font: inherit;
      font-weight: 720;
      cursor: pointer;
      transition: filter 160ms ease, transform 160ms ease;
    }

    .next-button:hover, .restart-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .next-button[hidden] { display: none; }

    .footer-note {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .result { padding: 42px clamp(24px, 6vw, 44px); text-align: center; }
    .result-emoji { margin-bottom: 13px; font-size: 58px; animation: float 2.4s ease-in-out infinite; }
    .result h1 { margin: 0; font-size: 29px; letter-spacing: -.04em; }
    .result-score { margin: 11px 0 0; color: var(--muted); font-size: 16px; }
    .result-score strong { color: var(--accent); font-size: 22px; }
    .result-best { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .result-storage-note { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .result-message { max-width: 360px; margin: 16px auto 26px; color: var(--muted); }
    .result h1:focus { outline: 3px solid color-mix(in srgb, var(--accent) 65%, transparent); outline-offset: 5px; }

    .card.reveal { animation: reveal 420ms cubic-bezier(.2, .8, .2, 1) both; }

    @keyframes shake {
      15%, 55%, 90% { transform: translateX(-5px); }
      35%, 75% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }
    @keyframes pop-in {
      45% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      50% { transform: translateY(-7px) rotate(3deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Orbit · Space Quiz</div>
    <section class="card" id="quiz" aria-label="Space exploration quiz">
      <div class="card-content">
        <div class="topline">
          <div class="mission-heading">
            <span class="eyebrow">Mission briefing</span>
            <span class="mission-status"><span class="status-light" aria-hidden="true"></span> Mission active</span>
          </div>
          <span class="score-pill" aria-live="polite"><span aria-hidden="true">★</span> Score <b id="score">0</b></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label"><span id="question-count">Question 1 of 10</span><span id="progress-percent">10%</span></div>
        <h1 class="question" id="question" tabindex="-1"></h1>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <button class="next-button" id="next-button" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
      </div>
    </section>
    <p class="footer-note" id="footer-note">10 quick questions. One small step for your brain.</p>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Mercury", "Jupiter"],
        correct: 1,
        fact: "Iron-rich dust gives Mars its rusty red color."
      },
      {
        question: "What is the name of the galaxy we call home?",
        answers: ["Andromeda", "Whirlpool Galaxy", "The Milky Way", "Sombrero Galaxy"],
        correct: 2,
        fact: "Our solar system sits in one of the Milky Way's spiral arms."
      },
      {
        question: "Which is the largest planet in our solar system?",
        answers: ["Saturn", "Neptune", "Earth", "Jupiter"],
        correct: 3,
        fact: "Jupiter is so big that more than 1,300 Earths could fit inside it."
      },
      {
        question: "What is the closest star to Earth?",
        answers: ["Sirius", "Proxima Centauri", "The Sun", "Polaris"],
        correct: 2,
        fact: "The Sun is about 150 million kilometers from Earth."
      },
      {
        question: "Which planet is famous for its spectacular rings?",
        answers: ["Saturn", "Mars", "Venus", "Mercury"],
        correct: 0,
        fact: "Saturn's rings are mostly made of ice and rocky fragments."
      },
      {
        question: "What was the first human-made object to reach space?",
        answers: ["Apollo 11", "Sputnik 1", "Vostok 1", "Voyager 1"],
        correct: 1,
        fact: "The Soviet satellite Sputnik 1 launched in 1957."
      },
      {
        question: "Which planet rotates almost completely on its side?",
        answers: ["Uranus", "Neptune", "Earth", "Jupiter"],
        correct: 0,
        fact: "Uranus has an axial tilt of about 98 degrees."
      },
      {
        question: "What is the name of the first person to walk on the Moon?",
        answers: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "John Glenn"],
        correct: 2,
        fact: "Neil Armstrong took humanity's first lunar steps in 1969."
      },
      {
        question: "Which planet has the most prominent giant storm, the Great Red Spot?",
        answers: ["Jupiter", "Saturn", "Neptune", "Mars"],
        correct: 0,
        fact: "Jupiter's Great Red Spot is a storm that has raged for centuries."
      },
      {
        question: "What do we call a rocky object that survives its journey through Earth's atmosphere?",
        answers: ["Comet", "Meteorite", "Asteroid", "Meteoroid"],
        correct: 1,
        fact: "A meteorite is a space rock that makes it all the way to the ground."
      }
    ];

    const quiz = document.querySelector("#quiz");
    const questionEl = document.querySelector("#question");
    const answersEl = document.querySelector("#answers");
    const feedbackEl = document.querySelector("#feedback");
    const scoreEl = document.querySelector("#score");
    const progressFill = document.querySelector("#progress-fill");
    const progressTrack = document.querySelector(".progress-track");
    const questionCount = document.querySelector("#question-count");
    const progressPercent = document.querySelector("#progress-percent");
    const nextButton = document.querySelector("#next-button");
    const footerNote = document.querySelector("#footer-note");
    let current = 0;
    let score = 0;
    let answered = false;
    const personalBestKey = "orbit-space-quiz-personal-best";

    function renderQuestion() {
      const item = questions[current];
      answered = false;
      questionCount.textContent = `Question ${current + 1} of ${questions.length}`;
      progressPercent.textContent = `${Math.round(((current + 1) / questions.length) * 100)}%`;
      progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", String(current + 1));
      questionEl.textContent = item.question;
      feedbackEl.textContent = "";
      nextButton.hidden = true;
      nextButton.innerHTML = current === questions.length - 1
        ? 'See my results <span aria-hidden="true">→</span>'
        : 'Next question <span aria-hidden="true">→</span>';
      answersEl.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.innerHTML = `<span class="answer-letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span></span>`;
        button.lastElementChild.textContent = answer;
        button.addEventListener("click", () => chooseAnswer(index));
        answersEl.append(button);
      });
    }

    function chooseAnswer(selected) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = [...answersEl.children];
      const isCorrect = selected === item.correct;

      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.correct) button.classList.add("correct");
        if (index === selected && !isCorrect) button.classList.add("wrong");
      });

      if (isCorrect) {
        score += 1;
        scoreEl.textContent = String(score);
        feedbackEl.innerHTML = `<strong>Brilliant! You got it.</strong> ${item.fact}`;
      } else {
        feedbackEl.innerHTML = `<strong>Not quite this time.</strong> ${item.fact}`;
      }
      nextButton.hidden = false;
    }

    function showResults() {
      const percentage = score / questions.length;
      const result = percentage === 1
        ? ["🏆", "Cosmic genius!", "A perfect flight! You know your way around the universe."]
        : percentage >= 0.7
          ? ["🚀", "Stellar work!", "Your space knowledge is truly out of this world."]
          : percentage >= 0.4
            ? ["🪐", "Nice orbit!", "You've got a great start. There's always more to discover."]
            : ["🌱", "Future astronaut!", "Every great explorer starts with a first mission. Try again and reach for the stars!"];

      let personalBest = null;
      let storageNote = "";
      let storage;
      try {
          storage = window.localStorage;
      } catch {
          storageNote = "Personal best is unavailable because browser storage could not be accessed.";
      }

      if (storage) {
          let savedBest = null;
          let storageReadable = true;
          try {
            const savedValue = storage.getItem(personalBestKey);
            const parsedValue = savedValue === null ? NaN : Number(savedValue);
            if (Number.isInteger(parsedValue) && parsedValue >= 0 && parsedValue <= questions.length) {
              savedBest = parsedValue;
            }
          } catch {
            storageReadable = false;
            storageNote = "Personal best is unavailable because browser storage could not be read.";
          }

          if (storageReadable) {
            personalBest = Math.max(savedBest ?? 0, score);
            if (savedBest === null || personalBest > savedBest) {
              try {
                storage.setItem(personalBestKey, String(personalBest));
              } catch {
                storageNote = "This personal best could not be saved for future visits.";
              }
            }
          }
      }

      quiz.classList.add("reveal");
      quiz.innerHTML = `
          <div class="result">
            <div class="result-emoji" role="img" aria-label="${result[0]}">${result[0]}</div>
            <p class="eyebrow">Mission complete</p>
            <h1 tabindex="-1">${result[1]}</h1>
            <p class="result-score">You scored <strong>${score} / ${questions.length}</strong></p>
            <p class="result-best">Personal best: <strong>${personalBest === null ? "Unavailable" : `${personalBest} / ${questions.length}`}</strong></p>
            ${storageNote ? `<p class="result-storage-note" role="status">${storageNote}</p>` : ""}
            <p class="result-message">${result[2]}</p>
            <button class="restart-button" id="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>
          </div>`;
      footerNote.textContent = "The universe is always full of surprises.";
      quiz.querySelector(".result h1").focus({ preventScroll: true });
      document.querySelector("#restart-button").addEventListener("click", () => window.location.reload());
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      current += 1;
      if (current === questions.length) {
        showResults();
      } else {
        renderQuestion();
        questionEl.focus({ preventScroll: true });
      }
    });

    renderQuestion();
  </script>
</body>
</html>
